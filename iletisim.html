<main id="main" class="wrap">
  <div class="page-head rv">
    <p class="eyebrow">02 / 03</p>
    <h1 data-i="c.title">İletişim</h1>
    <p data-i="c.sub">Formu doldur, mesajın doğrudan bana ulaşsın.</p>
  </div>
  <div class="contact" style="margin-top:34px">
    <aside class="side card rv">
      <h3 data-i="c.side">Diğer yollar</h3>
      <a class="rep" href="https://github.com/kaansemihkurt" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 16 16"><use href="#gh"/></svg><span data-i="more.b">GitHub profilim</span></a>
    </aside>
    <form id="contact-form" class="card rv" action="https://formspree.io/f/xdekjqaw" method="POST" accept-charset="UTF-8">
      <div class="fld"><label for="ad" data-i="f.ad">Ad</label>
        <input id="ad" name="ad" type="text" placeholder="Adın" data-i-attr="placeholder:f.ad.ph" autocomplete="given-name" required></div>
      <div class="fld"><label for="soyad" data-i="f.soyad">Soyad</label>
        <input id="soyad" name="soyad" type="text" placeholder="Soyadın" data-i-attr="placeholder:f.soyad.ph" autocomplete="family-name" required></div>
      <div class="fld"><label for="email" data-i="f.email">E-posta adresi</label>
        <input id="email" name="email" type="email" placeholder="ornek@mail.com" autocomplete="email" required></div>
      <div class="fld"><label for="telefon" data-i="f.tel">Telefon numarası</label>
        <input id="telefon" name="telefon" type="tel" inputmode="tel" placeholder="05XX XXX XX XX" autocomplete="tel" pattern="[0-9+()\s\-]{10,18}" title="Geçerli bir telefon numarası gir (örn. 05XX XXX XX XX)" data-i-attr="title:f.tel.title" required></div>
      <div class="fld full"><label for="neden" data-i="f.neden">İletişim nedeni</label>
        <select id="neden" name="iletisim_nedeni" required>
          <option value="" disabled selected data-i="f.neden.ph">Bir neden seç</option>
          <option value="İş Teklifi" data-i="f.o1">İş Teklifi</option>
          <option value="Proje/Veri Bilimi Danışmanlığı" data-i="f.o2">Proje/Veri Bilimi Danışmanlığı</option>
          <option value="Soru" data-i="f.o3">Soru</option>
          <option value="Diğer" data-i="f.o4">Diğer</option>
        </select></div>
      <div class="fld full"><label for="mesaj" data-i="f.mesaj">Detaylı mesaj</label>
        <textarea id="mesaj" name="mesaj" placeholder="Merhaba Kaan, ..." data-i-attr="placeholder:f.mesaj.ph" maxlength="1000" required></textarea>
        <span class="count" id="count" aria-hidden="true">0 / 1000</span></div>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="Portfolyo sitesinden yeni mesaj">
      <button class="btn pri" type="submit" data-i="f.send">Gönder</button>
      <p class="hint" data-i="f.hint">Tüm alanlar zorunludur.</p>
    </form>
  </div>
</main>
